<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sangueaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffe4e6" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#881337" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#sangueaGrad)" />

  <!-- Protective Vitality Symbol: Stylized Drop of Life & Embracing Care Arc -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Outer Gentle Orbit Arc -->
    <path d="M-130,-40 C-130,-120 0,-170 80,-120 C140,-80 150,10 90,90 C40,150 -60,150 -100,100" 
          fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" />
    
    <!-- Central Vital Drop -->
    <path d="M0,-120 C40,-60 100,0 100,60 C100,115 55,160 0,160 C-55,160 -100,115 -100,60 C-100,0 -40,-60 0,-120 Z" 
          fill="#ffffff" />
          
    <!-- Inner Radiant Pulse Core -->
    <path d="M0,-50 C20,-10 50,20 50,55 C50,85 28,110 0,110 C-28,110 -50,85 -50,55 C-50,20 -20,-10 0,-50 Z" 
          fill="url(#sangueaGrad)" opacity="0.9" />

    <!-- Sparkle / Hope Star in safe zone -->
    <circle cx="20" cy="30" r="10" fill="#ffffff" />
  </g>
</svg>
